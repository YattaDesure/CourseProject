services:
  # SQL Server
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2025-CTP2.0-ubuntu-22.04
    container_name: greenquarter-sqlserver
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=22332123Yaz
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
      - ./init-db:/backup
      - ./init-db:/scripts
    networks:
      - greenquarter-network
    restart: unless-stopped
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -S localhost -U SA -P "22332123Yaz" -C -Q "SELECT 1" || exit 1
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 30s

  # Database Initialization
  db-init:
    image: mcr.microsoft.com/mssql/server:2025-CTP2.0-ubuntu-22.04
    container_name: greenquarter-db-init
    environment:
      - SA_PASSWORD=22332123Yaz
    volumes:
      - ./init-db:/scripts
    networks:
      - greenquarter-network
    depends_on:
      sqlserver:
        condition: service_healthy
    command: /bin/bash /scripts/init-database.sh
    restart: "no"

  # Backend: только runtime aspnet (без sdk в Docker — иначе часто падает pull mcr.microsoft.com/dotnet/sdk).
  # Перед первым запуском один раз: ./publish-backend.sh  (или: dotnet publish … -o backend/publish)
  backend:
    image: mcr.microsoft.com/dotnet/aspnet:9.0
    container_name: greenquarter-api
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://0.0.0.0:5001
      - ConnectionStrings__DefaultConnection=Server=sqlserver,1433;Database=Cursovaya;User Id=SA;Password=22332123Yaz;TrustServerCertificate=True;Connection Timeout=60;
      - JWT__Key=YourSuperSecretKeyThatIsAtLeast32CharactersLong!
      - JWT__Issuer=GreenQuarter
      - JWT__Audience=GreenQuarterUsers
      - AllowedOrigins=http://localhost:5173,http://localhost:80,http://localhost,http://127.0.0.1:80,http://127.0.0.1
    volumes:
      - ./backend/publish:/app
    ports:
      - "5001:5001"
    depends_on:
      sqlserver:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
    entrypoint: >
      /bin/sh -c "
      if [ ! -f /app/GreenQuarter.Api.dll ]; then
        echo 'Ошибка: нет /app/GreenQuarter.Api.dll. На Mac выполни из папки проекта: ./publish-backend.sh';
        exit 1;
      fi;
      echo '⏳ Пауза перед стартом API...';
      sleep 8;
      exec dotnet /app/GreenQuarter.Api.dll
      "
    networks:
      - greenquarter-network
    restart: unless-stopped

  # Frontend (API только через Nginx /api → backend; отдельно трогать БД не нужно)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ""
    container_name: greenquarter-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - greenquarter-network
    restart: unless-stopped

networks:
  greenquarter-network:
    driver: bridge

volumes:
  sqlserver_data:

